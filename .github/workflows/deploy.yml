name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build:gh-pages
        env:
          VITE_BASE_PATH: /vote-2025/

      - name: Create 404.html for SPA routing
        run: |
          cat > dist/404.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>استعلام عن بيانات الانتخابات</title>
            <script>
              var pathSegmentsToKeep = 1;
              var l = window.location;
              var path = l.pathname;
              
              if (path.indexOf('/vote-2025') === 0) {
                path = path.slice('/vote-2025'.length) || '/';
              }
              
              var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + 
                '/vote-2025/index.html';
              
              if (path !== '/') {
                redirectUrl += '?/' + path.replace(/^\//, '').replace(/&/g, '~and~');
              }
              
              if (l.search) {
                redirectUrl += (path === '/' ? '?' : '&') + l.search.slice(1).replace(/&/g, '~and~');
              }
              
              if (l.hash) {
                redirectUrl += l.hash;
              }
              
              window.location.replace(redirectUrl);
            </script>
          </head>
          <body>
            <p>جاري التوجيه...</p>
          </body>
          </html>
          EOF

      - name: Create .nojekyll
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


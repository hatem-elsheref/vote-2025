name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare files for deployment
        run: |
          # Create deployment directory
          mkdir -p _site
          
          # Copy index.html (already exists or use standalone)
          if [ -f "index.html" ]; then
            cp index.html _site/
          elif [ -f "index-standalone.html" ]; then
            cp index-standalone.html _site/index.html
          fi
          
          # Copy banner image
          if [ -f "bassem-eldeeb.jpg" ]; then
            cp bassem-eldeeb.jpg _site/
          elif [ -f "src/assets/bassem-eldeeb.jpg" ]; then
            cp src/assets/bassem-eldeeb.jpg _site/bassem-eldeeb.jpg
          fi
          
          # List files for debugging
          echo "Files in _site:"
          ls -la _site/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

